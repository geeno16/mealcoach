[tool.ruff]
line-length = 72
target-version = "py312"
fix = true
exclude = [
    ".venv",
    "venv",
    "/opt/venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "alembic/versions"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
