services:
  db:
    image: postgres:16
    platform: linux/amd64
    container_name: mealcoach_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mealcoach_app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    command: bash -c "npm --prefix /workspace/frontend install && tail -f /dev/null"

volumes:
  postgres_data:
